<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index">
<title>데일리디저트 약관·정책</title>
<style>
:root { color-scheme: light dark; --bg: #fff6e4; --text: #4e342e; --line: #e6d5b8; --head: #f6e7c8; --link: #c62828; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1d1614; --text: #f3e9dd; --line: #3b2f2b; --head: #2a211e; --link: #ff8a80; }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  line-height: 1.7; color: var(--text); background: var(--bg);
  -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: break-word;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
h1 { font-size: 1.55rem; line-height: 1.35; margin: 0 0 16px; text-wrap: balance; }
h2 { font-size: 1.2rem; line-height: 1.35; margin: 36px 0 10px; padding-top: 8px; }
p { margin: 12px 0; }
ul, ol { margin: 12px 0; padding-left: 22px; }
li { margin: 6px 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
strong { font-weight: 700; }
a { color: var(--link); word-break: break-all; }
table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.92rem; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 9px 11px; text-align: left; vertical-align: top; }
th { background: var(--head); font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
<h1>데일리디저트</h1>
<ul>
<li><a href="terms.html">이용약관</a></li>
<li><a href="privacy.html">개인정보 처리방침</a></li>
</ul>
</div>
</body>
</html>
